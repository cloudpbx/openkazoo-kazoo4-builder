name: build
on:
  push:
    tags: ['v4.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to gh-pages + create Release'
        type: boolean
        default: false
      components:
        # publish.sh rebuilds the apt repo from only this run's debs, and the
        # gh-pages deploy replaces the whole directory, so narrowing this while
        # publishing REMOVES the omitted components from the repo. That is the
        # intended lever for withdrawing a bad package, and the reason not to
        # narrow it for a routine publish.
        description: 'JSON list of components to build'
        type: string
        default: '["erlang","kazoo","freeswitch","kamailio"]'

permissions:
  contents: write   # create releases + push gh-pages

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # inputs.components is unset on a tag push, so fall back to all four.
        component: ${{ fromJSON(inputs.components || '["erlang","kazoo","freeswitch","kamailio"]') }}
        arch: [amd64, arm64]
        distro: [debian-11, debian-12]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build ${{ matrix.component }} (${{ matrix.distro }}/${{ matrix.arch }})
        run: make build COMPONENT=${{ matrix.component }} DISTRO=${{ matrix.distro }}
      - name: Sign
        if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "$PWD":/work \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE \
            openkazoo-kazoo4-builder:${{ matrix.distro }} /work/scripts/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.component }}-${{ matrix.distro }}-${{ matrix.arch }}
          # keep the build/out/<codename>/ layout so publish can route by codename
          path: build/out

  publish:
    needs: build
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Collect debs into build/out/<codename>/
        run: |
          # Each artifact preserves its build/out/<codename>/ layout; the deb's
          # parent dir is its codename, so route each file back by that name.
          find _artifacts -name '*.deb' | while read -r f; do
            cn="$(basename "$(dirname "$f")")"
            mkdir -p "build/out/$cn"
            cp "$f" "build/out/$cn/"
          done
          find build/out -type f -name '*.deb' | sort
      - name: Assemble apt repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          make docker-build
          docker run --rm -v "$PWD":/work \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE \
            openkazoo-kazoo4-builder:debian-12 /work/scripts/publish.sh
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/repo
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/*/*.deb
