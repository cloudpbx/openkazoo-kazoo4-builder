name: verify-install
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [debian-11, debian-12]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:${{ matrix.distro == 'debian-11' && '11' || '12' }}
    env:
      CODENAME: ${{ matrix.distro == 'debian-11' && 'bullseye' || 'bookworm' }}
    steps:
      - name: Add repo + install
        shell: bash
        run: |
          set -euo pipefail

          # Debian 11 left LTS, so bullseye-security's index is expired and its
          # pool 404s. docker/Dockerfile.debian-11 already works around this
          # (docs/DECISIONS.md D-02) but this workflow runs a raw debian:11, so
          # it needs the same treatment or even `apt-get install curl` fails.
          # Keep SECURITY_SNAPSHOT in step with the Dockerfile.
          if [ "$CODENAME" = bullseye ]; then
            printf '%s\n' \
              'deb http://deb.debian.org/debian bullseye main' \
              'deb http://deb.debian.org/debian bullseye-updates main' \
              'deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main' \
              > /etc/apt/sources.list
            printf '%s\n' 'Acquire::Check-Valid-Until "false";' 'Acquire::Retries "10";' \
              > /etc/apt/apt.conf.d/99bullseye-eol
          fi

          apt-get update && apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://cloudpbx.github.io/openkazoo-kazoo4-builder/pubkey.asc \
            | tee /usr/share/keyrings/openkazoo.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/openkazoo.asc] \
            https://cloudpbx.github.io/openkazoo-kazoo4-builder/debian ${CODENAME} main" \
            > /etc/apt/sources.list.d/openkazoo.list

          # This workflow fires on build completion, but the repo is served by
          # GitHub Pages, whose deploy lags the gh-pages push by minutes. Racing
          # it produces "Unable to locate package kazoo" against a repo that is
          # fine, which reads exactly like a broken package. Wait for Pages to
          # serve an index listing every package before trusting a failure.
          PKGS="https://cloudpbx.github.io/openkazoo-kazoo4-builder/debian/dists/${CODENAME}/main/binary-$(dpkg --print-architecture)/Packages"
          for i in $(seq 1 30); do
            missing=""
            body="$(curl -fsSL "$PKGS" 2>/dev/null || true)"
            for p in kazoo freeswitch kamailio erlang; do
              printf '%s' "$body" | grep -qx "Package: $p" || missing="$missing $p"
            done
            [ -z "$missing" ] && { echo "Pages index complete after ${i} attempt(s)"; break; }
            echo "waiting for Pages to serve:$missing (attempt $i/30)"
            [ "$i" = 30 ] && { echo "Pages never served:$missing"; exit 1; }
            sleep 20
          done

          apt-get update
          apt-get install -y kazoo freeswitch kamailio
      - name: Smoke-test artifacts present
        shell: bash
        run: |
          set -euo pipefail
          test -d /opt/kazoo
          test -f /usr/lib/freeswitch/mod/mod_kazoo.so
          command -v kamailio
          /usr/local/lib/erlang/bin/erl -eval 'io:format("~s~n",[erlang:system_info(otp_release)]),halt().' -noshell | grep -q '^26'
          # FreeSWITCH links spandsp 3.x — the deb must bundle it and FS must
          # resolve all its libs (guards the multiarch bundle-glob regression).
          test -e /usr/lib/libspandsp.so.3
          ! ldd /usr/bin/freeswitch | grep -q 'not found'
          # Kamailio modules kazoo-configs-kamailio loadmodule's must be shipped
          # (guards the include_modules gap).
          #
          # Collect the module dirs that exist before searching. Passing both
          # unconditionally made `find` exit 1 for the absent one, and this step
          # runs under `-o pipefail`, so the pipeline returned 1 even when the
          # module was found and printed. That reported every module as missing
          # on all four legs while the packages were fine. The 2>/dev/null was
          # hiding find's own complaint about the missing path, so drop it.
          kam_dirs=""
          for d in /usr/lib64/kamailio /usr/lib/kamailio; do
            [ -d "$d" ] && kam_dirs="$kam_dirs $d"
          done
          [ -n "$kam_dirs" ] || { echo "no kamailio module directory found"; exit 1; }
          echo "kamailio module dirs:$kam_dirs"
          for m in websocket presence presence_xml outbound uuid; do
            find $kam_dirs -name "$m.so" | grep -q . \
              || { echo "missing kamailio module: $m.so"; exit 1; }
          done
          # postinst must create the kamailio service user/group.
          getent passwd kamailio
          getent group kamailio

      # The check whose absence let two non-booting kazoo packages reach the
      # apt repo. `rebar3 tar` exits 0 for a release that cannot start, so the
      # only way to know is to start it. No RabbitMQ or CouchDB here, so a
      # healthy node is out of reach; what is in reach is proving the release
      # gets through boot with its ERTS applications started, which is exactly
      # what was broken.
      - name: Boot the installed kazoo release
        shell: bash
        run: |
          set -euo pipefail
          REL=/opt/kazoo/releases/0.0.0
          test -f "$REL/kazoo.boot" || { echo "no kazoo.boot — the runner execs -boot $REL/kazoo"; exit 1; }

          # Static assertions on the shipped script, mirroring the build gate.
          ( cd "$REL" && /usr/local/lib/erlang/bin/erl -noshell -eval '
              {ok, Bin} = file:read_file("kazoo.boot"),
              {script, {Name, _}, Instrs} = binary_to_term(Bin),
              Started = [A || {apply, {application, start_boot, [A | _]}} <- Instrs],
              Required = [crypto, ssl, public_key, asn1, compiler, runtime_tools, syntax_tools, kazoo],
              case [A || A <- Required, not lists:member(A, Started)] of
                [] -> io:format("~s starts ~p apps~n", [Name, length(Started)]), halt(0);
                M  -> io:format("FATAL: never starts ~p~n", [M]), halt(1)
              end.' )

          # Every lib path the script references must exist. This is the check
          # that catches the in-place upgrade failure mode, where the boot
          # script survives but points at lib dirs dpkg has replaced.
          # kazoo_ecallmgr.boot gets the same check. It has to come from this
          # package, or an upgrade leaves it pointing at replaced dirs (CORV-1506).
          dpkg -S "$REL/kazoo_ecallmgr.boot" >/dev/null \
            || { echo "FATAL: kazoo_ecallmgr.boot is not shipped by the kazoo package"; exit 1; }
          for boot in kazoo.boot kazoo_ecallmgr.boot; do
            ( cd "$REL" && BOOT="$boot" /usr/local/lib/erlang/bin/erl -noshell -eval '
                Boot = os:getenv("BOOT"),
                {ok, Bin} = file:read_file(Boot),
                {script, _, Instrs} = binary_to_term(Bin),
                Paths = lists:usort(lists:append([P || {path, P} <- Instrs])),
                Missing = [P || P <- Paths,
                                Abs <- ["/opt/kazoo" ++ string:prefix(P, "$ROOT")],
                                not filelib:is_dir(Abs)],
                case Missing of
                  [] -> io:format("~s: all ~p boot paths present~n", [Boot, length(Paths)]), halt(0);
                  _  -> io:format("FATAL: ~s references absent dirs ~p~n", [Boot, Missing]), halt(1)
                end.' )
          done

          # Now actually start it. Booting past the ERTS apps is the signal;
          # dying later for want of RabbitMQ/CouchDB is expected here.
          ERTS=$(basename "$(ls -d /usr/local/lib/erlang/erts-*)")
          set +e
          ROOTDIR=/opt/kazoo BINDIR="/usr/local/lib/erlang/$ERTS/bin" EMU=beam \
            timeout 90 "/usr/local/lib/erlang/$ERTS/bin/erlexec" \
              -boot "$REL/kazoo" -noshell -sname vi$$ -setcookie verify \
              > /tmp/boot.log 2>&1
          rc=$?
          set -e
          echo "erlexec exit=$rc (124 means it was still running, i.e. booted)"
          if grep -qE 'Runtime terminating during boot|load_failed' /tmp/boot.log; then
            echo "FATAL: release failed during boot"
            grep -oE 'load_failed,\[[^]]*' /tmp/boot.log | head -1
            tail -30 /tmp/boot.log
            exit 1
          fi
          if grep -qE "undef,\[\{(crypto|ssl|public_key|asn1)," /tmp/boot.log; then
            echo "FATAL: an ERTS application was not started (undef on its API)"
            tail -30 /tmp/boot.log
            exit 1
          fi
          echo "release booted past its ERTS applications"
